<text text-anchor="start" x="174.5" y="-546.5" font-family="DejaVu Sans" font-size="10.00">Subject: ResourceCatalog · RealSubject: CommunityCatalog</text>
<text text-anchor="start" x="174.5" y="-535.5" font-family="DejaVu Sans" font-size="10.00">Proxy: OwnerProtectedCatalog, misma interfaz que el real.</text>
<text text-anchor="start" x="174.5" y="-524.5" font-family="DejaVu Sans" font-size="10.00">catalog se tipa como ResourceCatalog; en la composición</text>
<text text-anchor="start" x="174.5" y="-513.5" font-family="DejaVu Sans" font-size="10.00">se inyecta CommunityCatalog.</text>
<text text-anchor="start" x="174.5" y="-502.5" font-family="DejaVu Sans" font-size="10.00">edit y withdraw delegan solo si visitorId coincide con</text>
<text text-anchor="start" x="174.5" y="-491.5" font-family="DejaVu Sans" font-size="10.00">el publicante registrado; si no, lanzan el error 403.</text>
<text text-anchor="start" x="174.5" y="-480.5" font-family="DejaVu Sans" font-size="10.00">visitorId = huella SHA&#45;256 de la cookie, nunca la clave.</text>
</g>
